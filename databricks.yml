# Copper Retirement Solution Accelerator — Declarative Automation Bundle
#
# ONE-COMMAND DEPLOY (any workspace; host comes from your CLI profile / env auth):
#   databricks bundle deploy -t <dev|staging|prod|partner> --var warehouse_id=<WAREHOUSE_ID>
# Optional overrides: --var catalog_name=... --var schema_name=... --var vs_endpoint=...
#   --var vs_index=... (both OPTIONAL, DEC-VS-OPTIONAL) --var serving_endpoint=... --var llm_endpoint=... --var lakebase_project=... --var lakebase_branch=...
#   --var lakebase_host=... --var lakebase_database=... (copper-task-board app Lakebase connection)
# Or export BUNDLE_VAR_<name>=<value> instead of --var flags.
#
# Targets:
#   dev / staging / prod -> REUSE existing infra (catalog + schema already exist).
#   partner              -> fresh workspace: also creates the ${var.schema_name} schema.
# Prerequisites (not created by this bundle): the catalog, a SQL warehouse,
# a Lakebase project, and the risk serving endpoint (created by beat1_risk_model_walkthrough
# retrain template). See PARTNER-PLAYBOOK.md.
# A Vector Search endpoint is OPTIONAL (DEC-VS-OPTIONAL): default retrieval is the UC TVF
# search_regulatory_chunks over regulatory_doc_chunks; set vs_endpoint/vs_index only to
# enable the VS path. The partner target needs no VS vars.
#
# Managed resources: 1 pipeline, 1 refresh job, 1 seed job, 1 weekly risk scoring job, 1 lakebase sync job, 2 apps (unified accelerator + copper-task-board).
# Fresh partner workspace: after deploy, run `databricks bundle run -t partner seed_synthetic_sources_job`
# to create the SYNTHETIC upstream source tables and build the pipeline (ACC-DE-SEED-JOB).
#
# POST-DEPLOY GRANTS (catalog owner, once per workspace; ACC-DEVOPS-BUNDLE-SP-GRANTS):
#   SP=$(databricks apps get retirement-plan-<target> --output json | jq -r .service_principal_client_id)
#   GRANT USE CATALOG ON CATALOG <catalog_name> TO `<SP>`;
#   GRANT USE SCHEMA, SELECT ON SCHEMA <catalog_name>.provable_resilience_intelligence TO `<SP>`;
# The partner target grants USE_SCHEMA/SELECT/EXECUTE on <catalog_name>.<schema_name> itself.
# dev/staging/prod reuse a pre-existing schema, so apply the same schema GRANT manually there.

bundle:
  name: copper_retirement

# Explicit include list: only ACTIVE resources. dig-triage and regulatory-assistant are fully
# retired (apps deleted, merged into retirement-plan tabs; ACC-DEVOPS-RM-DIGTRIAGE-BUNDLE,
# ACC-DEVOPS-RM-REGASSIST-BUNDLE). Any other file left in bundle/resources that is not listed
# here is inert and is never deployed.
include:
  - bundle/resources/copper_retirement_pipeline.pipeline.yml
  - bundle/resources/pipeline_refresh.job.yml
  - bundle/resources/seed_synthetic_sources.job.yml
  - bundle/resources/risk_scoring.job.yml
  - bundle/resources/retirement_plan.app.yml
  - bundle/resources/copper_task_board.app.yml
  - bundle/resources/lakebase_sync.job.yml

variables:
  catalog_name:
    description: Unity Catalog catalog (must already exist; TMF SID data model expected).
    default: cdm_tmforum
  schema_name:
    description: UC schema for accelerator pipeline, gold and regulatory tables.
    default: copper_retirement
  warehouse_id:
    description: REQUIRED. SQL warehouse ID used by the apps. Find it with `databricks warehouses list`.
  vs_endpoint:
    description: >-
      OPTIONAL (DEC-VS-OPTIONAL). Vector Search endpoint hosting the regulatory RAG index.
      Empty = VS disabled; retrieval uses the UC TVF search_regulatory_chunks.
      dev/staging/prod set the reference endpoint (DEC-VS-ENDPOINT-ACTUAL).
    default: ""
  vs_index:
    description: >-
      OPTIONAL (DEC-VS-OPTIONAL). Vector Search index (short name, in catalog_name.schema_name)
      for regulatory chunks. Empty = VS disabled.
    default: ""
  model_schema:
    description: UC schema (in catalog_name) holding the registered model copper_retirement_risk@champion used by the weekly scoring job.
    default: ml_models
  serving_endpoint:
    description: Model serving endpoint for the copper retirement risk model.
    default: copper-retirement-risk
  llm_endpoint:
    description: Foundation model endpoint used by the Regulatory tab for grounded, cited answers (ai_query).
    default: databricks-claude-sonnet-4-5
  lakebase_project:
    description: Lakebase Postgres project for task board and app write-back data.
    default: copper-task-board
  lakebase_branch:
    description: Lakebase branch used by apps.
    default: production
  lakebase_host:
    description: >-
      Postgres host of the Lakebase primary endpoint (projects/<lakebase_project>/branches/<lakebase_branch>/endpoints/primary),
      used by the copper-task-board app. Find it with `databricks postgres list-endpoints projects/<project>/branches/<branch>`.
      Partners MUST override this for their own Lakebase project.
    default: ep-rough-bar-d229503i.database.us-east-1.cloud.databricks.com
  lakebase_database:
    description: Lakebase Postgres database name used by the copper-task-board app.
    default: databricks_postgres

targets:
  dev:
    mode: development
    default: true
    variables:
      vs_endpoint: cmeg-demos-vs
      vs_index: regulatory_doc_chunks_vs_index

  staging:
    mode: development
    variables:
      vs_endpoint: cmeg-demos-vs
      vs_index: regulatory_doc_chunks_vs_index

  prod:
    mode: production
    variables:
      vs_endpoint: cmeg-demos-vs
      vs_index: regulatory_doc_chunks_vs_index
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

  partner:
    # Fresh partner workspace: same resources as prod plus schema creation.
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    resources:
      schemas:
        accelerator_schema:
          catalog_name: ${var.catalog_name}
          name: ${var.schema_name}
          comment: >-
            Copper Retirement Solution Accelerator: pipeline, gold, regulatory source
            and partner value tables. Network/customer data is SYNTHETIC.
          # ACC-DEVOPS-BUNDLE-SP-GRANTS: grant both app service principals read access on deploy,
          # so a fresh partner deploy needs no manual schema GRANTs. EXECUTE covers the Dig Triage
          # UC functions. Catalog USE_CATALOG (and USE_SCHEMA/SELECT on the seeded
          # provable_resilience_intelligence schema) stay a post-deploy step because the catalog is
          # a prerequisite, not a bundle resource; see POST-DEPLOY GRANTS in the header.
          grants:
            - principal: ${resources.apps.retirement_plan.service_principal_client_id}
              privileges: [USE_SCHEMA, SELECT, EXECUTE]
            - principal: ${resources.apps.copper_task_board.service_principal_client_id}
              privileges: [USE_SCHEMA, SELECT]
