bundle:
  name: copper_retirement

include:
  - bundle/resources/*.yml

variables:
  catalog_name:
    description: Unity Catalog catalog for the copper-retirement project (pre-existing TMF SID catalog).
    default: cdm_tmforum
  warehouse_id:
    description: SQL warehouse for dashboard and query execution.
    lookup:
      warehouse: 'Serverless Starter Warehouse'

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://fevm-cmegdemos.cloud.databricks.com
    variables:
      catalog_name: cdm_tmforum

  staging:
    mode: development
    workspace:
      host: https://fevm-cmegdemos.cloud.databricks.com
    variables:
      catalog_name: cdm_tmforum

  prod:
    mode: production
    workspace:
      host: https://fevm-cmegdemos.cloud.databricks.com
    variables:
      catalog_name: cdm_tmforum
