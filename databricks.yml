bundle:
  name: copper_retirement

include:
  - bundle/resources/*.yml

variables:
  catalog_name:
    description: Unity Catalog catalog for the copper-retirement project (pre-existing TMF SID catalog).
    default: cdm_tmforum

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://fevm-cmegdemos.cloud.databricks.com
    variables:
      catalog_name: cdm_tmforum
