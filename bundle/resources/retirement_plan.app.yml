# Copper Retirement — Unified Partner Accelerator App
# Tabbed AppKit (React/TypeScript) app consolidating all partner-facing beats:
#   Map/Risk | Plan | Dig Triage | Regulatory | Commodity
# Per DEC-ACCEL-UNIFIED-APP: commodity-dashboard, copper-map, dig-triage,
# and regulatory-assistant are merged here as tabs. Source app .yml files retired.
# Under the bundle, `config` below supersedes apps/retirement-plan/app.yaml; every
# infra name (warehouse, catalog, schema, LLM endpoint) is a bundle variable.

resources:
  apps:
    retirement_plan:
      name: 'retirement-plan-${bundle.target}'
      description: >-
        Unified Copper Retirement Accelerator — partner-facing tabbed app.
        Tabs: Map/Risk (H3 hex map, risk tiers), Plan (Gantt timeline,
        wave scheduling), Dig Triage (incident console), Regulatory
        (RAG assistant), Commodity (LME prices, EBITDA).
        Lakelink Fiber brand. WCAG AA.
      source_code_path: ../../apps/retirement-plan
      # ACC-QA-DEF-APP-CATALOG: bundle vars flow into the app env (overrides app.yaml env), so
      # `bundle deploy -t partner --var catalog_name=acme_cat` points every tab at the partner catalog.
      config:
        command: ['sh', '-c', 'npm install && npm run build && npm start']
        env:
          - name: DATABRICKS_WAREHOUSE_ID
            value_from: sql-warehouse
          - name: CATALOG
            value: ${var.catalog_name}
          - name: SCHEMA
            value: ${var.schema_name}
          - name: DIG_811_TABLE
            value: ${var.catalog_name}.provable_resilience_intelligence.stg_811_dig_ticket
          - name: LLM_ENDPOINT
            value: ${var.llm_endpoint}
          - name: SERVING_ENDPOINT
            value: ${var.serving_endpoint}
      # ACC-DEVOPS-BUNDLE-SP-GRANTS: app resources auto-grant the app service principal on deploy.
      # UC data grants (schema USE_SCHEMA/SELECT/EXECUTE) are declared on the partner-target schema
      # in databricks.yml; catalog USE_CATALOG is a documented post-deploy step (PARTNER-PLAYBOOK §6a).
      resources:
        - name: sql-warehouse
          description: SQL warehouse for analytics queries (--var warehouse_id)
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: llm-endpoint
          description: Foundation model endpoint the Regulatory tab calls through ai_query (--var llm_endpoint)
          serving_endpoint:
            name: ${var.llm_endpoint}
            permission: CAN_QUERY
