# Copper Retirement — Seed SYNTHETIC source tables, then refresh the pipeline (ACC-DE-SEED-JOB)
#
# Fresh partner workspace bootstrap. Run once after `bundle deploy -t partner`:
#   databricks bundle run -t partner seed_synthetic_sources_job
#
# Task 1 seeds every upstream table the pipeline and the accelerator app read
# (tmf_enterprise/resource/service/shared/customer, oracle_erp_source,
# ironclad_clm_source, salesforce_source, mdm_source,
# provable_resilience_intelligence.stg_811_dig_ticket and the
# ${var.schema_name} inputs) into ${var.catalog_name}, FK-consistent and labeled
# SYNTHETIC (table + column comments, copper.seed.synthetic=true, telco_project tag).
# Task 2 full-refreshes the pipeline so bronze/silver/gold build on the seed.
# Task 3 provisions the Dig Triage objects that read pipeline outputs
# (silver_dig_incident_enriched + UC functions incident_lookup, proximity_search,
# reroute_suggest) via scripts/provision_app_objects.py (ACC-QA-DEF-FRESH-PROVISION).
#
# ORDERING: run this job BEFORE opening the app. The app's DIG_811_TABLE
# (${var.catalog_name}.provable_resilience_intelligence.stg_811_dig_ticket) is
# created by task 1, and the Triage tab needs task 3.
# Task 4 loads the REAL, cited Regulatory tab reference objects (NOT synthetic):
# regulatory_source_register + jurisdiction_requirements_cited from
# data/reference/regulatory/*.jsonl, re-downloads every official_url into volume
# regulatory_source_docs, logs regulatory_source_files, parses/chunks/embeds into
# regulatory_doc_chunks (is_synthetic=false) and creates search_regulatory_chunks
# via scripts/load_regulatory_reference.py (ACC-DE-FRESH-REG-REFERENCE). Some
# official sites return 403/bot challenges; those rows are logged as failed/stub.
#
# Safety: the seeder refuses to overwrite any existing table that it did not
# write, so running this against the reference workspace (dev/prod targets)
# fails safely without touching curated tables. Add --dry-run to preview.

resources:
  jobs:
    seed_synthetic_sources_job:
      name: 'copper-retirement-seed-synthetic-${bundle.target}'
      description: >-
        Seeds SYNTHETIC, FK-consistent upstream source tables into ${var.catalog_name}
        for a fresh partner deployment, then full-refreshes the copper retirement pipeline.

      tasks:
        - task_key: 'seed_synthetic_sources'
          environment_key: 'seed_env'
          spark_python_task:
            python_file: ../../scripts/generate_synthetic_sources.py
            parameters:
              - '--mode'
              - 'tables'
              - '--catalog'
              - '${var.catalog_name}'
              - '--schema'
              - '${var.schema_name}'
              - '--max-rows'
              - '2000'

        - task_key: 'refresh_pipeline'
          depends_on:
            - task_key: 'seed_synthetic_sources'
          pipeline_task:
            pipeline_id: ${resources.pipelines.copper_retirement_pipeline.id}
            full_refresh: true

        - task_key: 'provision_app_objects'
          depends_on:
            - task_key: 'refresh_pipeline'
          environment_key: 'seed_env'
          spark_python_task:
            python_file: ../../scripts/provision_app_objects.py
            parameters:
              - '--catalog'
              - '${var.catalog_name}'
              - '--schema'
              - '${var.schema_name}'

        - task_key: 'load_regulatory_reference'
          depends_on:
            - task_key: 'seed_synthetic_sources'
          environment_key: 'seed_env'
          spark_python_task:
            python_file: ../../scripts/load_regulatory_reference.py
            parameters:
              - '--catalog'
              - '${var.catalog_name}'
              - '--schema'
              - '${var.schema_name}'

      environments:
        - environment_key: 'seed_env'
          spec:
            environment_version: '2'

      tags:
        telco_project: copper-retirement
        data_class: synthetic

      permissions:
        - level: CAN_MANAGE
          group_name: 'users'
