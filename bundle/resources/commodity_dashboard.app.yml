# Copper Retirement — Beat 5: Commodity Dashboard
# LME copper price tracking, scrap recovery forecasting, EBITDA impact.
# AppKit (React/TypeScript) read-only analytics app.
# App environment variables are defined in the app's own app.yaml.

resources:
  apps:
    commodity_dashboard:
      name: 'commodity-dashboard-${bundle.target}'
