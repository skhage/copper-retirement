# Copper Retirement — Lakeflow Spark Declarative Pipeline
# Bronze→Silver→Gold transformations for copper retirement analysis.
# Pipeline ID (manual): b52532a2-6398-44ed-b239-9e95cafb745c
#
# NOTE: This DAB resource will create a NEW managed pipeline on `bundle deploy`.
# The manually-created pipeline above can be decommissioned once this is validated.

resources:
  pipelines:
    copper_retirement_pipeline:
      name: 'copper-retirement-pipeline-${bundle.target}'

      catalog: ${var.catalog_name}
      target: ${var.schema_name}

      libraries:
        - glob:
            include: ../../pipeline/**

      # Infra names exposed to pipeline code via spark.conf.get("copper.<key>")
      configuration:
        copper.catalog: ${var.catalog_name}
        copper.schema: ${var.schema_name}
        copper.vs_endpoint: ${var.vs_endpoint}
        copper.vs_index: ${var.vs_index}
        copper.serving_endpoint: ${var.serving_endpoint}
        copper.lakebase_project: ${var.lakebase_project}

      serverless: true
      photon: true
      channel: current
      continuous: false

      tags:
        telco_project: copper-retirement

      permissions:
        - level: CAN_VIEW
          group_name: 'users'
