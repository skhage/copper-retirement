resources:
  catalogs:
    lumen_copper_catalog:
      name: ${var.catalog_name}
      comment: >-
        Lumen copper-retirement demo catalog. All data under this catalog is
        synthetic/simulated unless explicitly sourced from a public dataset
        (e.g. FCC BDC/Fabric); never real Lumen plant.

  schemas:
    lumen_copper_bronze:
      catalog_name: ${var.catalog_name}
      name: bronze
      comment: Raw landed sources (synthetic OSS/GIS, commodity, weather, contractor registry).
    lumen_copper_silver:
      catalog_name: ${var.catalog_name}
      name: silver
      comment: Cleaned, conformed, H3-indexed tables.
    lumen_copper_gold:
      catalog_name: ${var.catalog_name}
      name: gold
      comment: Business-ready tables (copper_retirement_readiness, commodity_price_features, etc).
    lumen_copper_ml:
      catalog_name: ${var.catalog_name}
      name: ml
      comment: Model training tables, MLflow-linked feature tables, model artifacts metadata.
    lumen_copper_ops:
      catalog_name: ${var.catalog_name}
      name: ops
      comment: Lakebase-synced operational tables (retirement plan, incidents, contractor assignments).
    lumen_copper_agents:
      catalog_name: ${var.catalog_name}
      name: agents
      comment: Agent definitions, eval sets, and traces.
