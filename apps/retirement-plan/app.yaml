# app.yaml — Copper Retirement Accelerator (unified partner-facing app; evolved from retirement-plan)
# DEC-ACCEL-UNIFIED-APP: tabs Map & Risk | Plan | Dig Triage | Regulatory | Commodity & Value
# Databricks Apps deployment config

command:
  - sh
  - -c
  - "npm install && npm run build && npm start"

name: retirement-plan
description: |
  Copper Retirement Solution Accelerator (partner-facing). One app, five tabs:
  Map & Risk, Plan (wave Gantt, migration table, budget, checklist, scenarios),
  Dig Triage, Regulatory (every answer cites an official source URL), Commodity & Value.
  Network/customer data is SYNTHETIC and labeled in the UI.

# Governance tags — applied to the Databricks App resource on deploy
# DAB bundle equivalent (bundle/databricks.yml):
#   resources:
#     apps:
#       retirement-plan:
#         tags:
#           telco_project: copper-retirement
#           developer: copper-app
tags:
  telco_project: copper-retirement   # directive 6: governed tag key telco_project (old `project` deprecated)
  developer: copper-app

resources:
  - name: sql-warehouse
    type: sql_warehouse
    # TODO: Set actual warehouse ID during deployment
    # id: <WAREHOUSE_ID>

# Features enabled via databricks apps init --features analytics,lakebase
features:
  - analytics
  # - lakebase  # Enable once P5-SCHEMA lands

# Environment variables (set during deploy)
env:
  - name: DATABRICKS_HOST
    description: Workspace URL
  - name: DATABRICKS_WAREHOUSE_ID
    description: SQL warehouse ID for analytics queries
  # Data location (partner override: edit these values to match --var catalog_name/schema_name)
  - name: CATALOG
    value: cdm_tmforum
  - name: SCHEMA
    value: copper_retirement
  - name: DIG_811_TABLE
    value: cdm_tmforum.provable_resilience_intelligence.stg_811_dig_ticket
  # - name: LAKEBASE_CONNECTION_STRING
  #   description: Lakebase Postgres connection for plan write-back (P5-SCHEMA)
