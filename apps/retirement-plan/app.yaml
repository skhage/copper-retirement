# app.yaml — Retirement Plan Tracker (P7-PLAN)
# Databricks Apps deployment config
# Scaffold: analytics + lakebase (read gold tables + write plan edits)

name: retirement-plan
description: |
  Retirement plan tracker for LakeLink Fiber's copper retirement program.
  Demo Beat 2: "Capital-efficient plan to zero copper?"
  Gantt/timeline visualization with wave sequencing, cost/benefit analysis,
  constraint flags, and Lakebase write-back for plan edits.
  All data is SYNTHETIC.

# Governance tags — applied to the Databricks App resource on deploy
# DAB bundle equivalent (bundle/databricks.yml):
#   resources:
#     apps:
#       retirement-plan:
#         tags:
#           project: copper-retirement
#           developer: copper-app
tags:
  project: copper-retirement
  developer: copper-app

resources:
  - name: sql-warehouse
    type: sql_warehouse
    # TODO: Set actual warehouse ID during deployment
    # id: <WAREHOUSE_ID>

# Features enabled via databricks apps init --features analytics,lakebase
features:
  - analytics
  # - lakebase  # Enable once P5-SCHEMA lands

# Environment variables (set during deploy)
env:
  - name: DATABRICKS_HOST
    description: Workspace URL
  - name: DATABRICKS_WAREHOUSE_ID
    description: SQL warehouse ID for analytics queries
  # - name: LAKEBASE_CONNECTION_STRING
  #   description: Lakebase Postgres connection for plan write-back (P5-SCHEMA)
