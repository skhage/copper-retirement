<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Copper Retirement — Task Board</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root{
      --aubergine:#3f0e40; --aubergine-2:#350d36; --aubergine-hover:rgba(255,255,255,.08);
      --sidebar-text:#bcabbc; --sidebar-strong:#f7f7f7; --active:#1164a3;
      --copper:#d4571f; --copper-dark:#b8460f; --green:#007a5a; --green-hover:#148567;
      --bg:#ffffff; --panel:#ffffff; --rail:#f8f8f8;
      --border:#e3e1e4; --border-strong:#d0cdd2;
      --text:#1d1c1d; --muted:#616061; --faint:#8d8d8d;
      --hover:#f6f6f6; --link:#1264a3;
      --crit-bg:#fde4e2; --crit-tx:#a12018; --crit-bd:#f3b6b1;
      --high-bg:#fdeddb; --high-tx:#9a5b00; --high-bd:#f2d3a6;
      --med-bg:#e6f2fb; --med-tx:#1264a3; --med-bd:#bcdcf3;
      --norm-bg:#efeff0; --norm-tx:#5c5c5c; --norm-bd:#e0e0e0;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Lato,Roboto,Helvetica,Arial,sans-serif;
      background:var(--bg);color:var(--text);font-size:15px;line-height:1.46;-webkit-font-smoothing:antialiased}
    #root{height:100%}
    button{font-family:inherit}
    ::-webkit-scrollbar{width:10px;height:10px}
    ::-webkit-scrollbar-thumb{background:#c9c6cb;border-radius:6px;border:2px solid transparent;background-clip:content-box}
    ::-webkit-scrollbar-thumb:hover{background:#a9a6ab;background-clip:content-box}

    /* ── Shell ─────────────────────────────────────────── */
    .app{display:flex;height:100vh;overflow:hidden}

    /* ── Sidebar ───────────────────────────────────────── */
    .sidebar{width:270px;flex-shrink:0;background:var(--aubergine);color:var(--sidebar-text);display:flex;flex-direction:column;overflow:hidden}
    .ws-head{padding:13px 16px;border-bottom:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:default}
    .ws-title{display:flex;align-items:center;gap:9px;min-width:0}
    .ws-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--copper),#e8823f);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:.95rem;flex-shrink:0;box-shadow:0 1px 2px rgba(0,0,0,.3)}
    .ws-name{color:var(--sidebar-strong);font-weight:800;font-size:1.02rem;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ws-name .caret{font-size:.7rem;margin-left:4px;color:var(--sidebar-text)}
    .ws-name .subtle{display:block;font-weight:500;font-size:.72rem;color:var(--sidebar-text);letter-spacing:0}
    .ws-refresh{background:none;border:none;color:var(--sidebar-text);cursor:pointer;width:30px;height:30px;border-radius:7px;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:background .12s}
    .ws-refresh:hover{background:var(--aubergine-hover);color:#fff}
    .ws-refresh.spin{animation:spin .8s linear infinite}

    .rail{flex:1;overflow-y:auto;padding:10px 0 24px}
    .rail::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);background-clip:content-box}
    .sec{margin-top:14px}
    .sec-head{display:flex;align-items:center;justify-content:space-between;padding:2px 18px 2px 16px;color:var(--sidebar-text);font-size:.78rem;font-weight:600;letter-spacing:.02em;text-transform:none}
    .sec-head .plus{background:none;border:none;color:var(--sidebar-text);cursor:pointer;font-size:.95rem;width:20px;height:20px;border-radius:5px;line-height:1}
    .sec-head .plus:hover{background:var(--aubergine-hover);color:#fff}
    .row{display:flex;align-items:center;gap:9px;padding:5px 16px;cursor:pointer;font-size:.95rem;color:var(--sidebar-text);border:none;background:none;width:100%;text-align:left;transition:background .1s}
    .row:hover{background:var(--aubergine-hover)}
    .row.active{background:var(--active);color:#fff;font-weight:600}
    .row .hash{opacity:.7;font-weight:500}
    .row.active .hash{opacity:.9}
    .row .rname{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .row .count{font-size:.74rem;background:rgba(255,255,255,.16);color:#fff;border-radius:9px;padding:0 7px;min-width:18px;text-align:center;font-weight:600}
    .row.active .count{background:rgba(255,255,255,.28)}
    .avatar{width:20px;height:20px;border-radius:5px;flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.6rem;font-weight:800}
    .presence{position:absolute;right:-3px;bottom:-3px;width:9px;height:9px;border-radius:50%;border:2px solid var(--aubergine)}
    .row.active .presence{border-color:var(--active)}
    .presence.on{background:#2bac76}
    .presence.off{background:var(--aubergine);border-color:var(--sidebar-text)}

    /* ── Main column ───────────────────────────────────── */
    .main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
    .topbar{height:52px;flex-shrink:0;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:12px}
    .tb-left{display:flex;flex-direction:column;min-width:0}
    .tb-title{font-weight:800;font-size:1.02rem;display:flex;align-items:center;gap:6px;color:var(--text)}
    .tb-title .hash{color:var(--faint);font-weight:600}
    .tb-topic{font-size:.76rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
    .tb-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
    .members{display:flex;align-items:center;gap:5px;font-size:.82rem;color:var(--muted);border:1px solid var(--border);border-radius:7px;padding:4px 9px;font-weight:600}
    .search{display:flex;align-items:center;gap:6px;background:var(--rail);border:1px solid var(--border);border-radius:7px;padding:5px 10px;min-width:180px}
    .search input{border:none;background:none;outline:none;font-size:.85rem;width:100%;color:var(--text)}
    .search input::placeholder{color:var(--faint)}
    .toggle{display:flex;align-items:center;gap:5px;font-size:.78rem;color:var(--muted);cursor:pointer;user-select:none}
    .toggle input{accent-color:var(--green)}
    .icon-btn{border:1px solid var(--border);background:#fff;color:var(--muted);border-radius:7px;width:32px;height:32px;cursor:pointer;font-size:.95rem;display:flex;align-items:center;justify-content:center;transition:background .12s}
    .icon-btn:hover{background:var(--hover)}
    .clock{font-size:.72rem;color:var(--faint)}

    /* filter banner */
    .filter-banner{display:flex;align-items:center;gap:8px;padding:7px 16px;background:#fff7ed;border-bottom:1px solid #fcd9b6;font-size:.82rem;color:var(--copper-dark)}
    .filter-banner b{color:var(--text)}
    .filter-banner button{margin-left:auto;background:none;border:1px solid #f0c48f;color:var(--copper-dark);border-radius:6px;padding:2px 9px;cursor:pointer;font-size:.76rem;font-weight:600}
    .filter-banner button:hover{background:#fdecd8}

    /* error toast */
    .toast{margin:10px 16px 0;background:#fde4e2;color:var(--crit-tx);border:1px solid var(--crit-bd);border-radius:8px;padding:9px 12px;font-size:.84rem;display:flex;align-items:center;gap:10px}
    .toast button{margin-left:auto;background:none;border:none;color:var(--crit-tx);cursor:pointer;font-weight:700;font-size:1rem}

    /* ── Feed ──────────────────────────────────────────── */
    .feed{flex:1;overflow-y:auto;padding:14px 0 8px}
    .day-div{display:flex;align-items:center;gap:12px;margin:14px 20px 6px}
    .day-div::before,.day-div::after{content:"";flex:1;height:1px;background:var(--border)}
    .day-div span{font-size:.76rem;font-weight:700;color:var(--muted);border:1px solid var(--border);border-radius:20px;padding:2px 12px;background:#fff}

    .msg{display:flex;gap:11px;padding:7px 20px;position:relative}
    .msg:hover{background:var(--hover)}
    .msg .av{width:36px;height:36px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:.82rem}
    .msg-main{flex:1;min-width:0}
    .msg-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
    .msg-name{font-weight:800;font-size:.92rem;color:var(--text)}
    .msg-time{font-size:.73rem;color:var(--faint)}
    .msg-ctx{font-size:.78rem;color:var(--link);font-weight:600;margin:1px 0 2px}
    .msg-body{font-size:.9rem;color:#26262a;white-space:pre-wrap;word-break:break-word}
    .msg-body code{background:#f4f2f4;border:1px solid var(--border);padding:0 4px;border-radius:4px;font-size:.85em;color:#a12018;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .msg-actions{position:absolute;top:-10px;right:16px;display:none;gap:2px;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:2px}
    .msg:hover .msg-actions{display:flex}
    .msg-actions button{border:none;background:none;cursor:pointer;width:28px;height:28px;border-radius:6px;font-size:.9rem;color:var(--muted)}
    .msg-actions button:hover{background:var(--hover)}
    .msg-actions button.del:hover{background:#fde4e2;color:var(--crit-tx)}

    /* task message specifics */
    .task-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .task-check{width:17px;height:17px;accent-color:var(--green);cursor:pointer;flex-shrink:0}
    .task-name{font-weight:800;font-size:.94rem}
    .msg.done .task-name{text-decoration:line-through;color:var(--faint)}
    .msg.done .av{filter:grayscale(.6);opacity:.7}
    .tag{font-size:.68rem;font-weight:800;letter-spacing:.02em;padding:2px 8px;border-radius:20px;border:1px solid;text-transform:uppercase}
    .tag.critical{background:var(--crit-bg);color:var(--crit-tx);border-color:var(--crit-bd)}
    .tag.high{background:var(--high-bg);color:var(--high-tx);border-color:var(--high-bd)}
    .tag.medium{background:var(--med-bg);color:var(--med-tx);border-color:var(--med-bd)}
    .tag.normal{background:var(--norm-bg);color:var(--norm-tx);border-color:var(--norm-bd)}
    .signals{font-size:.78rem;color:var(--muted);margin-top:3px}
    .signals b{color:var(--faint);font-weight:700}

    /* ── Pinned AI summary ─────────────────────────────── */
    .pinned{margin:6px 16px 12px;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04)}
    .pin-head{display:flex;align-items:center;gap:10px;padding:11px 15px;background:linear-gradient(90deg,#fbf0e9,#fdf7f2);border-bottom:1px solid var(--border)}
    .pin-bot{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--copper),#eb9a5f);display:flex;align-items:center;justify-content:center;font-size:1.05rem;flex-shrink:0}
    .pin-titles{flex:1;min-width:0}
    .pin-name{font-weight:800;font-size:.9rem;display:flex;align-items:center;gap:7px}
    .pin-name .app-badge{font-size:.6rem;font-weight:800;background:var(--norm-bg);color:var(--muted);border-radius:4px;padding:1px 5px;letter-spacing:.03em}
    .pin-name .pin-icon{color:var(--copper);font-size:.78rem}
    .pin-head-sub{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .pin-meta{display:flex;gap:6px;flex-shrink:0}
    .pill{font-size:.7rem;font-weight:700;color:var(--muted);background:#fff;border:1px solid var(--border);border-radius:20px;padding:2px 9px}
    .pill.ai{color:var(--green);border-color:#b6e0d0;background:#e8f6f0}
    .pin-body{padding:12px 15px}
    .pin-lead{font-size:.85rem;color:#33333a;margin-bottom:10px}
    .pin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:9px}
    .pin-item{border:1px solid var(--border);border-radius:9px;padding:10px 12px;background:var(--rail)}
    .pin-item-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px}
    .pin-rank{font-size:.72rem;font-weight:800;color:var(--faint)}
    .pin-label{font-weight:800;font-size:.85rem;margin-bottom:2px}
    .pin-owner{font-size:.75rem;color:var(--copper-dark);font-weight:700;margin-bottom:5px}
    .pin-sum{font-size:.8rem;color:#3a3a40;line-height:1.45;margin-bottom:5px}
    .pin-why{font-size:.75rem;color:var(--muted)}
    .pin-why b{color:var(--faint)}
    .pin-muted{font-size:.83rem;color:var(--muted);padding:2px 0}
    .regen{margin-left:6px;background:none;border:1px solid var(--border);border-radius:6px;padding:2px 9px;font-size:.72rem;color:var(--muted);cursor:pointer;font-weight:600}
    .regen:hover{background:var(--hover)}

    /* ── Composer ──────────────────────────────────────── */
    .composer{flex-shrink:0;padding:0 16px 18px}
    .composer-box{border:1px solid var(--border-strong);border-radius:11px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05)}
    .composer-box:focus-within{border-color:#8f8f8f}
    .composer-fields{display:flex;gap:8px;padding:9px 11px 0;flex-wrap:wrap;align-items:center}
    .composer input.label-in,.composer input.ctx-in{flex:1;min-width:150px;border:none;outline:none;font-size:.9rem;background:none;color:var(--text);font-weight:700}
    .composer input.label-in::placeholder,.composer input.ctx-in::placeholder{color:var(--faint);font-weight:400}
    .composer select{border:1px solid var(--border);border-radius:7px;padding:4px 8px;font-size:.8rem;background:#fff;color:var(--text);cursor:pointer}
    .composer textarea{width:100%;border:none;outline:none;resize:none;padding:8px 12px 10px;font-size:.92rem;font-family:inherit;color:var(--text);background:none;min-height:44px;max-height:200px}
    .composer textarea::placeholder{color:var(--faint)}
    .composer-bar{display:flex;align-items:center;justify-content:space-between;padding:6px 10px 8px;gap:8px}
    .composer-hint{font-size:.72rem;color:var(--faint)}
    .send{background:var(--green);color:#fff;border:none;border-radius:8px;padding:7px 15px;font-size:.85rem;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;transition:background .12s}
    .send:hover{background:var(--green-hover)}
    .send:disabled{background:#d7d7d7;color:#f4f4f4;cursor:not-allowed}

    /* ── States ────────────────────────────────────────── */
    .empty{text-align:center;padding:56px 20px;color:var(--faint)}
    .empty .big{font-size:2rem;margin-bottom:8px}
    .empty .t{font-size:1rem;font-weight:700;color:var(--muted);margin-bottom:3px}
    .empty .s{font-size:.85rem}
    .boot{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--muted);background:var(--aubergine)}
    .boot .mark{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,var(--copper),#e8823f);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:1.5rem;box-shadow:0 4px 16px rgba(0,0,0,.3)}
    .boot .spinner{width:26px;height:26px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
    .boot .txt{color:#e9dce9;font-size:.9rem}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ── Responsive ────────────────────────────────────── */
    .hamburger{display:none;border:none;background:none;cursor:pointer;font-size:1.15rem;color:var(--muted);width:34px;height:34px;border-radius:7px}
    .hamburger:hover{background:var(--hover)}
    .scrim{display:none}
    @media (max-width:820px){
      .sidebar{position:fixed;z-index:40;height:100vh;left:0;top:0;transform:translateX(-100%);transition:transform .2s;box-shadow:2px 0 16px rgba(0,0,0,.25)}
      .sidebar.open{transform:none}
      .scrim.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35}
      .hamburger{display:flex;align-items:center;justify-content:center}
      .search{min-width:0;width:130px}
      .tb-topic{max-width:40vw}
      .members span.lbl{display:none}
    }
    @media (max-width:520px){
      .search{display:none}
      .clock{display:none}
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const {useState, useEffect, useCallback, useMemo, useRef} = React;

    /* Agents = workspace members. Color/avatar identity per role. */
    const AGENTS = [
      {tag:'@data-planner',  color:'#8a5cf6'},
      {tag:'@data-engineer', color:'#2eb67d'},
      {tag:'@data-analyst',  color:'#36a3eb'},
      {tag:'@ml-engineer',   color:'#e8912d'},
      {tag:'@pm',            color:'#e01e5a'},
      {tag:'@qa',            color:'#12a19a'},
      {tag:'@devops',        color:'#5b6ee1'},
      {tag:'@app-developer', color:'#c2410c'},
    ];
    const OWNERS = AGENTS.map(a => a.tag);
    const AGENT_BY_TAG = Object.fromEntries(AGENTS.map(a => [a.tag, a]));

    function initials(tag){
      const s = (tag || '').replace(/^@/, '');
      const parts = s.split(/[-_ ]/).filter(Boolean);
      if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
      return s.slice(0,2).toUpperCase();
    }
    function agentMeta(name){
      if (!name) return {tag:'@unknown', color:'#9aa0a6'};
      const found = AGENTS.find(a => name.includes(a.tag));
      return found || {tag:name, color:'#9aa0a6'};
    }
    function displayName(tag){ return (tag || '').replace(/^@/, ''); }
    function crit(c){ return (c || 'Normal').toLowerCase(); }

    function timeOf(iso){
      if (!iso) return '';
      const d = new Date(iso);
      if (isNaN(d)) return '';
      return d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
    }
    function prettyDate(str){
      if (!str) return '';
      const d = new Date(str + (str.length === 10 ? 'T00:00:00' : ''));
      if (isNaN(d)) return str;
      const today = new Date(); const y = new Date(); y.setDate(today.getDate()-1);
      const same = (a,b) => a.toDateString() === b.toDateString();
      if (same(d, today)) return 'Today';
      if (same(d, y)) return 'Yesterday';
      return d.toLocaleDateString([], {weekday:'long', month:'long', day:'numeric'});
    }

    /* Render inline `code` spans safely into a body string. */
    function Body({text}){
      const parts = String(text || '').split(/(`[^`]+`)/g);
      return <span>{parts.map((p,i) =>
        p.startsWith('`') && p.endsWith('`')
          ? <code key={i}>{p.slice(1,-1)}</code>
          : <React.Fragment key={i}>{p}</React.Fragment>
      )}</span>;
    }

    function Avatar({tag, size, cls}){
      const m = agentMeta(tag);
      const px = size || 36;
      return <div className={cls || 'av'} style={{background:m.color, width:px, height:px}}>{initials(m.tag)}</div>;
    }

    const CHANNELS = [
      {id:'task-board',   name:'task-board',   topic:'Shared work items · ranked by criticality'},
      {id:'agent-updates',name:'agent-updates',topic:'Status updates from the coordination agents'},
    ];

    function App(){
      const [tasks, setTasks] = useState([]);
      const [messages, setMessages] = useState([]);
      const [stats, setStats] = useState({tasks:0, done:0, agents:0});
      const [summary, setSummary] = useState(null);
      const [loading, setLoading] = useState(true);
      const [saving, setSaving] = useState(false);
      const [error, setError] = useState(null);
      const [lastFetched, setLastFetched] = useState(null);
      const [autoRefresh, setAutoRefresh] = useState(true);
      const [refreshing, setRefreshing] = useState(false);

      const [channel, setChannel] = useState('task-board');
      const [agentFilter, setAgentFilter] = useState('');
      const [search, setSearch] = useState('');
      const [navOpen, setNavOpen] = useState(false);

      /* composer — task */
      const [newLabel, setNewLabel] = useState('');
      const [newOwner, setNewOwner] = useState('@data-engineer');
      const [newDesc, setNewDesc] = useState('');
      /* composer — message */
      const [msgAgent, setMsgAgent] = useState('@data-planner');
      const [msgCtx, setMsgCtx] = useState('');
      const [msgBody, setMsgBody] = useState('');

      /* ---- fetch ---- */
      const fetchTasks = useCallback(async () => {
        try{
          const r = await fetch('/api/tasks');
          if(!r.ok){ const d = await r.json().catch(()=>({})); throw new Error(d.detail || `HTTP ${r.status}`); }
          const d = await r.json(); setTasks(d.tasks || []); setError(null);
        }catch(e){ setError(e.message); }
        finally{ setLoading(false); }
      }, []);
      const fetchMessages = useCallback(async () => {
        try{ const r = await fetch('/api/messages'); if(!r.ok) return; const d = await r.json(); setMessages(d.messages || []); }catch(e){}
      }, []);
      const fetchStats = useCallback(async () => {
        try{ const r = await fetch('/api/stats'); if(!r.ok) return; setStats(await r.json()); }catch(e){}
      }, []);
      const fetchSummary = useCallback(async () => {
        try{ const r = await fetch('/api/summary'); if(!r.ok) return; setSummary(await r.json()); }catch(e){}
      }, []);

      const refreshAll = useCallback(async (silent=false) => {
        if(!silent) setRefreshing(true);
        await Promise.all([fetchTasks(), fetchMessages(), fetchStats(), fetchSummary()]);
        setLastFetched(new Date());
        if(!silent) setRefreshing(false);
      }, [fetchTasks, fetchMessages, fetchStats, fetchSummary]);

      useEffect(() => { refreshAll(); }, [refreshAll]);
      useEffect(() => {
        if(!autoRefresh) return;
        const id = setInterval(() => refreshAll(true), 30000);
        return () => clearInterval(id);
      }, [autoRefresh, refreshAll]);

      /* ---- task actions ---- */
      const toggleDone = async (task) => {
        setSaving(true);
        try{
          const r = await fetch(`/api/tasks/${task.id}`, {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify({done:!task.done})});
          if(!r.ok){ const d = await r.json().catch(()=>({})); throw new Error(d.detail || `HTTP ${r.status}`); }
          refreshAll(true);
        }catch(e){ setError(e.message); } finally{ setSaving(false); }
      };
      const addTask = async () => {
        if(!newLabel.trim()) return;
        setSaving(true);
        try{
          const r = await fetch('/api/tasks', {method:'POST', headers:{'Content-Type':'application/json'},
            body:JSON.stringify({label:newLabel.trim(), owner:newOwner, description:newDesc.trim()})});
          if(!r.ok){ const d = await r.json().catch(()=>({})); throw new Error(d.detail || `HTTP ${r.status}`); }
          setNewLabel(''); setNewDesc(''); refreshAll(true);
        }catch(e){ setError(e.message); } finally{ setSaving(false); }
      };
      const deleteTask = async (id) => {
        if(!confirm('Delete this task?')) return;
        try{ await fetch(`/api/tasks/${id}`, {method:'DELETE'}); refreshAll(true); }
        catch(e){ setError(e.message); }
      };
      const postMessage = async () => {
        if(!msgBody.trim()) return;
        setSaving(true);
        try{
          const r = await fetch('/api/messages', {method:'POST', headers:{'Content-Type':'application/json'},
            body:JSON.stringify({agent:msgAgent, task_label:msgCtx.trim(), body:msgBody.trim()})});
          if(!r.ok){ const d = await r.json().catch(()=>({})); throw new Error(d.detail || `HTTP ${r.status}`); }
          setMsgBody(''); setMsgCtx(''); refreshAll(true);
        }catch(e){ setError(e.message); } finally{ setSaving(false); }
      };

      /* ---- derived ---- */
      const filteredTasks = useMemo(() => {
        let t = tasks;
        if(agentFilter) t = t.filter(x => x.owner === agentFilter);
        if(search.trim()){
          const s = search.toLowerCase();
          t = t.filter(x => (x.label||'').toLowerCase().includes(s) || (x.description||'').toLowerCase().includes(s));
        }
        return t;
      }, [tasks, agentFilter, search]);

      const filteredMessages = useMemo(() => {
        let m = messages;
        if(agentFilter) m = m.filter(x => (x.agent||'').includes(agentFilter));
        if(search.trim() && channel === 'agent-updates'){
          const s = search.toLowerCase();
          m = m.filter(x => (x.body||'').toLowerCase().includes(s) || (x.task_label||'').toLowerCase().includes(s));
        }
        return m;
      }, [messages, agentFilter, search, channel]);

      /* group messages by date for dividers */
      const groupedMessages = useMemo(() => {
        const groups = []; let cur = null;
        for(const m of filteredMessages){
          const key = m.msg_date || '';
          if(!cur || cur.date !== key){ cur = {date:key, items:[]}; groups.push(cur); }
          cur.items.push(m);
        }
        return groups;
      }, [filteredMessages]);

      /* which agents are "present" = own a task or have posted */
      const activeAgents = useMemo(() => {
        const s = new Set();
        tasks.forEach(t => s.add(t.owner));
        messages.forEach(m => AGENTS.forEach(a => { if((m.agent||'').includes(a.tag)) s.add(a.tag); }));
        return s;
      }, [tasks, messages]);

      const chMeta = CHANNELS.find(c => c.id === channel) || CHANNELS[0];
      const openCount = stats.tasks - stats.done;

      if(loading) return (
        <div className="boot">
          <div className="mark">C</div>
          <div className="spinner"></div>
          <div className="txt">Connecting to Lakebase…</div>
        </div>
      );

      return (
        <div className="app">
          <div className={`scrim ${navOpen?'show':''}`} onClick={()=>setNavOpen(false)}></div>

          {/* ── Sidebar ── */}
          <aside className={`sidebar ${navOpen?'open':''}`}>
            <div className="ws-head">
              <div className="ws-title">
                <div className="ws-mark">C</div>
                <div style={{minWidth:0}}>
                  <div className="ws-name">Copper Retirement<span className="caret">▾</span></div>
                  <span className="ws-name subtle">{stats.done}/{stats.tasks} tasks done</span>
                </div>
              </div>
              <button className={`ws-refresh ${refreshing?'spin':''}`} title="Refresh" onClick={()=>refreshAll()}>⟳</button>
            </div>

            <div className="rail">
              <div className="sec">
                <div className="sec-head"><span>Channels</span></div>
                {CHANNELS.map(c => (
                  <button key={c.id} className={`row ${channel===c.id?'active':''}`}
                    onClick={()=>{ setChannel(c.id); setNavOpen(false); }}>
                    <span className="hash">#</span>
                    <span className="rname">{c.name}</span>
                    <span className="count">{c.id==='task-board'?tasks.length:messages.length}</span>
                  </button>
                ))}
              </div>

              <div className="sec">
                <div className="sec-head">
                  <span>Agents{agentFilter?' · filtered':''}</span>
                </div>
                <button className={`row ${agentFilter===''?'active':''}`} onClick={()=>setAgentFilter('')}>
                  <span style={{width:20,textAlign:'center',opacity:.8}}>✦</span>
                  <span className="rname">All agents</span>
                  <span className="count">{AGENTS.length}</span>
                </button>
                {AGENTS.map(a => {
                  const on = activeAgents.has(a.tag);
                  return (
                    <button key={a.tag} className={`row ${agentFilter===a.tag?'active':''}`}
                      onClick={()=>setAgentFilter(agentFilter===a.tag ? '' : a.tag)}>
                      <span className="avatar" style={{background:a.color}}>
                        {initials(a.tag)}
                        <span className={`presence ${on?'on':'off'}`}></span>
                      </span>
                      <span className="rname">{displayName(a.tag)}</span>
                    </button>
                  );
                })}
              </div>
            </div>
          </aside>

          {/* ── Main ── */}
          <main className="main">
            <div className="topbar">
              <div style={{display:'flex',alignItems:'center',gap:8,minWidth:0}}>
                <button className="hamburger" onClick={()=>setNavOpen(true)}>☰</button>
                <div className="tb-left">
                  <div className="tb-title"><span className="hash">#</span>{chMeta.name}</div>
                  <div className="tb-topic">{chMeta.topic}</div>
                </div>
              </div>
              <div className="tb-right">
                <div className="search">
                  <span style={{color:'var(--faint)',fontSize:'.8rem'}}>⌕</span>
                  <input placeholder={channel==='task-board'?'Search tasks…':'Search messages…'}
                    value={search} onChange={e=>setSearch(e.target.value)} />
                </div>
                <div className="members" title="Workspace members">👥 <span className="lbl">{stats.agents || AGENTS.length}</span></div>
                <label className="toggle" title="Auto-refresh every 30s">
                  <input type="checkbox" checked={autoRefresh} onChange={e=>setAutoRefresh(e.target.checked)} /> Auto
                </label>
                {lastFetched && <span className="clock">{lastFetched.toLocaleTimeString()}</span>}
              </div>
            </div>

            {agentFilter && (
              <div className="filter-banner">
                Showing only <Avatar tag={agentFilter} size={16} cls="avatar" /> <b>{displayName(agentFilter)}</b>
                <button onClick={()=>setAgentFilter('')}>Clear filter</button>
              </div>
            )}

            {error && <div className="toast">⚠️ {error}<button onClick={()=>setError(null)}>×</button></div>}

            <div className="feed">
              {/* Pinned AI summary — only in #task-board */}
              {channel==='task-board' && (
                <div className="pinned">
                  <div className="pin-head">
                    <div className="pin-bot">🤖</div>
                    <div className="pin-titles">
                      <div className="pin-name">
                        <span className="pin-icon">📌</span> Prioritizer
                        <span className="app-badge">APP</span>
                      </div>
                      <div className="pin-head-sub">{summary?.headline || 'Ranking outstanding work…'}</div>
                    </div>
                    <div className="pin-meta">
                      {summary?.mode && <span className={`pill ${summary.mode==='ai'?'ai':''}`}>{summary.mode==='ai'?'AI-ranked':'Heuristic'}</span>}
                      <span className="pill">{openCount} open</span>
                      <button className="regen" onClick={()=>fetchSummary()}>Regenerate</button>
                    </div>
                  </div>
                  <div className="pin-body">
                    {summary?.summary && <div className="pin-lead">{summary.summary}</div>}
                    {summary?.items?.length > 0 ? (
                      <div className="pin-grid">
                        {summary.items.map((it,i) => (
                          <div key={`${it.label}-${i}`} className="pin-item">
                            <div className="pin-item-top">
                              <span className="pin-rank">#{it.rank || i+1}</span>
                              <span className={`tag ${crit(it.criticality)}`}>{it.criticality || 'Normal'}</span>
                            </div>
                            <div className="pin-label">{it.label}</div>
                            <div className="pin-owner">{it.owner}</div>
                            {it.summary && <div className="pin-sum">{it.summary}</div>}
                            {it.rationale && <div className="pin-why"><b>Why:</b> {it.rationale}</div>}
                          </div>
                        ))}
                      </div>
                    ) : <div className="pin-muted">No open tasks to summarize.</div>}
                  </div>
                </div>
              )}

              {/* Channel content */}
              {channel==='task-board' ? (
                filteredTasks.length === 0 ? (
                  <div className="empty">
                    <div className="big">🗂️</div>
                    <div className="t">No tasks here yet</div>
                    <div className="s">{agentFilter ? `Nothing assigned to ${displayName(agentFilter)}.` : (search ? `Nothing matches “${search}”.` : 'Add the first task below.')}</div>
                  </div>
                ) : filteredTasks.map(t => {
                  const m = agentMeta(t.owner);
                  return (
                    <div key={t.id} className={`msg ${t.done?'done':''}`}>
                      <Avatar tag={t.owner} />
                      <div className="msg-main">
                        <div className="msg-top">
                          <span className="msg-name">{displayName(t.owner)}</span>
                          <span className="msg-time">{timeOf(t.updated_at || t.created_at)}</span>
                        </div>
                        <div className="task-line">
                          <input type="checkbox" className="task-check" checked={t.done} disabled={saving} onChange={()=>toggleDone(t)} />
                          <span className="task-name">{t.label}</span>
                          <span className={`tag ${crit(t.criticality)}`}>{t.criticality}</span>
                        </div>
                        {t.description && <div className="msg-body" style={{marginTop:3}}><Body text={t.description} /></div>}
                        {t.reasons?.length > 0 && <div className="signals"><b>Signals:</b> {t.reasons.join(' · ')}</div>}
                      </div>
                      <div className="msg-actions">
                        <button title={t.done?'Mark not done':'Mark done'} onClick={()=>toggleDone(t)}>{t.done?'↩︎':'✓'}</button>
                        <button className="del" title="Delete task" onClick={()=>deleteTask(t.id)}>🗑</button>
                      </div>
                    </div>
                  );
                })
              ) : (
                groupedMessages.length === 0 ? (
                  <div className="empty">
                    <div className="big">💬</div>
                    <div className="t">No updates yet</div>
                    <div className="s">{agentFilter ? `No messages from ${displayName(agentFilter)}.` : 'Post the first update below.'}</div>
                  </div>
                ) : groupedMessages.map((g,gi) => (
                  <div key={gi}>
                    <div className="day-div"><span>{prettyDate(g.date)}</span></div>
                    {g.items.map((m,i) => (
                      <div key={m.id || `${gi}-${i}`} className="msg">
                        <Avatar tag={m.agent} />
                        <div className="msg-main">
                          <div className="msg-top">
                            <span className="msg-name">{displayName(m.agent)}</span>
                            <span className="msg-time">{timeOf(m.created_at) || m.msg_date}</span>
                          </div>
                          {m.task_label && <div className="msg-ctx">↳ {m.task_label}</div>}
                          <div className="msg-body"><Body text={m.body} /></div>
                        </div>
                      </div>
                    ))}
                  </div>
                ))
              )}
            </div>

            {/* ── Composer ── */}
            <div className="composer">
              <div className="composer-box">
                {channel==='task-board' ? (
                  <>
                    <div className="composer-fields">
                      <input className="label-in" placeholder="Task label (e.g. P1-FIX-DATA)"
                        value={newLabel} onChange={e=>setNewLabel(e.target.value)}
                        onKeyDown={e=>{ if(e.key==='Enter' && (e.metaKey||e.ctrlKey)) addTask(); }} />
                      <select value={newOwner} onChange={e=>setNewOwner(e.target.value)}>
                        {OWNERS.map(o => <option key={o} value={o}>{o}</option>)}
                      </select>
                    </div>
                    <textarea placeholder="Describe the task…  (⌘/Ctrl+Enter to add)"
                      value={newDesc} onChange={e=>setNewDesc(e.target.value)}
                      onKeyDown={e=>{ if(e.key==='Enter' && (e.metaKey||e.ctrlKey)) addTask(); }} />
                    <div className="composer-bar">
                      <span className="composer-hint">Posts to <b>#task-board</b> as {displayName(newOwner)}</span>
                      <button className="send" disabled={saving || !newLabel.trim()} onClick={addTask}>
                        {saving ? 'Adding…' : 'Add task'} <span>➤</span>
                      </button>
                    </div>
                  </>
                ) : (
                  <>
                    <div className="composer-fields">
                      <select value={msgAgent} onChange={e=>setMsgAgent(e.target.value)}>
                        {OWNERS.map(o => <option key={o} value={o}>{o}</option>)}
                      </select>
                      <input className="ctx-in" placeholder="Related task (optional)"
                        value={msgCtx} onChange={e=>setMsgCtx(e.target.value)} />
                    </div>
                    <textarea placeholder={`Message #agent-updates…  (⌘/Ctrl+Enter to send)`}
                      value={msgBody} onChange={e=>setMsgBody(e.target.value)}
                      onKeyDown={e=>{ if(e.key==='Enter' && (e.metaKey||e.ctrlKey)) postMessage(); }} />
                    <div className="composer-bar">
                      <span className="composer-hint">Posting as <b>{displayName(msgAgent)}</b></span>
                      <button className="send" disabled={saving || !msgBody.trim()} onClick={postMessage}>
                        {saving ? 'Sending…' : 'Send'} <span>➤</span>
                      </button>
                    </div>
                  </>
                )}
              </div>
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
